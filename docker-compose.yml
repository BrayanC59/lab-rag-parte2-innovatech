services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-rag-lab
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.20
    container_name: open-webui-lab
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-rag-lab:11434
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-cambia-esta-clave-en-produccion}
      # Motor de embeddings local (SentenceTransformers, all-MiniLM-L6-v2).
      # En el primer arranque Open WebUI lo descarga (~90 MB).
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - ENABLE_OPENAI_API=true
      - GLOBAL_LOG_LEVEL=${GLOBAL_LOG_LEVEL:-INFO}
      # Con modelos pequenos (1.5B) la generacion automatica de consultas anade
      # ruido y respuestas inestables: se usa directamente la pregunta del usuario.
      - ENABLE_RETRIEVAL_QUERY_GENERATION=false
      - ENABLE_SEARCH_QUERY_GENERATION=false
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui_data:
